# Déploiement type : MODE Stock + Caddy (HTTPS automatique Let's Encrypt). Voir docs/DEPLOIEMENT.md.
#   cp .env.example .env    (puis renseigner ORG_CODE, DOMAIN, administrateur initial…)
#   docker compose up -d --build
services:
  mode-stock:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1" # derrière Caddy : adresse IP réelle et HTTPS pris en compte
    volumes:
      - mode-data:/data
    expose:
      - "8080"
    # Durcissement : système de fichiers en lecture seule (seul le volume /data s'écrit), aucun privilège noyau,
    # aucune élévation possible — une faille dans l'application ne donnerait presque rien sur la machine.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - mode-stock
    # Seul le nom de domaine : le proxy ne reçoit ni la clé API, ni le code d'accès, ni le PIN initial (.env).
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant dans .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  mode-data:
  caddy-data:
  caddy-config:
