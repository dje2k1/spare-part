<!-- Politique de sécurité : aucun script ni gestionnaire en ligne, aucune ressource tierce.

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<meta name="description" content="Gestion de stock de pièces détachées : scan, transferts entre dépôts, inventaire, tableau de bord.">

<noscript><p style="padding:2rem;font-family:sans-serif">MODE Stock nécessite JavaScript pour fonctionner.</p></noscript>

<!-- Écran de démarrage (remplacé par l'application dès que le JS est prêt) -->
<div id="boot" class="boot" role="status" aria-label="Chargement"><span class="boot__logo">MODE</span></div>

<!-- Connexion / installation (rendus par js/ui/views/login.js) -->
<main id="login" class="login" hidden></main>

<!-- Application -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar__in">
      <div class="topbar__side topbar__side--left">
        <button class="icon-btn" id="btn-back" data-action="nav.back" aria-label="Retour" hidden><svg class="i"><use href="#i-back"/></svg></button>
      </div>
      <h1 class="topbar__title" id="topbar-title"></h1>
      <div class="topbar__side">
        <span class="depot-chip" id="depot-chip" hidden></span>
        <span class="net-dot net-dot--off" id="net-dot" role="img" aria-label="Hors ligne" title="Hors ligne" hidden></span>
        <button class="icon-btn sync-btn" id="sync-btn" data-action="sync.status" aria-label="Synchronisation" hidden><svg class="i"><use href="#i-cloud"/></svg><span class="sync-btn__count" id="sync-count" hidden></span></button>
        <button class="icon-btn" data-action="menu.open" aria-label="Menu" aria-haspopup="dialog"><svg class="i"><use href="#i-menu"/></svg><span class="badge-dot" id="menu-dot" hidden></span></button>
      </div>
    </div>
  </header>

  <div id="banners" aria-live="polite"></div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <div class="tabbar__in">
      <a class="tabbar__btn" href="#/home" data-nav="home"><svg class="i"><use href="#i-home"/></svg><span>Accueil</span></a>
      <a class="tabbar__btn" href="#/articles" data-nav="articles"><svg class="i"><use href="#i-box"/></svg><span>Articles</span></a>
      <a class="tabbar__fab" href="#/scan" data-nav="scan" aria-label="Scanner"><svg class="i"><use href="#i-scan"/></svg></a>
      <a class="tabbar__btn" href="#/orders" data-nav="orders"><svg class="i"><use href="#i-truck"/></svg><span>Commandes</span><span class="tabbar__count" id="orders-count" hidden></span></a>
      <button class="tabbar__btn" data-action="menu.open" aria-haspopup="dialog"><svg class="i"><use href="#i-menu"/></svg><span>Plus</span></button>
    </div>
  </nav>
</div>

<!-- Fenêtres : feuille (détails), modale (confirmation, PIN), tiroir (menu) -->
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
<dialog id="drawer" class="drawer" aria-label="Menu"></dialog>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div><!-- écran affiché, annoncé aux lecteurs d'écran -->
<div id="print-root" class="print-root" aria-hidden="true"></div>
